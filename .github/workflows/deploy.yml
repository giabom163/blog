name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 国内/网络不稳时用国内镜像，失败可注释掉这段改用官方源
      - name: Set npm mirror
        run: |
          echo "registry=https://registry.npmmirror.com" >> ~/.npmrc
          echo "sharp_binary_host=https://registry.npmmirror.com/-/binary/sharp" >> ~/.npmrc
          echo "sharp_libvips_binary_host=https://registry.npmmirror.com/-/binary/sharp-libvips" >> ~/.npmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: --max-old-space-size=4096

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=giabom-blog --branch=main --commit-dirty=true
