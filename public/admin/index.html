<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>博客管理后台</title>
  </head>
  <body>
    <!--
      Sveltia CMS（Decap CMS 的现代重写版）
      登录方式：页面上的「Sign In Using Access Token」，填一次 GitHub token 即可，
      不需要 OAuth 后端服务。token 需要对仓库有 Contents 读写权限。

      注意：这个地址是公开可访问的，token 只存在你自己浏览器本地，
      但仍建议生成一个只授权单个仓库的细粒度 token，用完可随时吊销。
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
