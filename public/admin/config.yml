# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS 配置 —— 字段严格对齐 src/content/config.ts 里的 posts schema
# 登录：页面右上角账号按钮 → Sign In Using Access Token，粘贴 GitHub token
#
backend:
  name: github
  repo: giabom163/blog
  branch: main

# 图片：跟本地发稿工具保持同一个目录，线上 /uploads/xxx.png 直接可访问
media_folder: public/uploads
public_folder: /uploads

site_url: https://giabom.online
locale: zh_Hans

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    slug: "{{fields.slug || fields.title}}"
    # 中文标题做文件名会不安全，统一转slug（字母数字连字符）
    slug_template: "{{slugify}}{{fields.title}}"
    delete: true
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} · {{published}}"
    sortable_fields: [published, title]
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 网址后缀
        name: slug
        widget: string
        required: false
        hint: 留空会按标题自动生成；填了就用你填的（只影响文件名，网址会变）
      - label: 摘要
        name: description
        widget: text
        required: false
        hint: 列表页显示的那段话
      - label: 发布日期
        name: published
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: 分类
        name: category
        widget: string
        required: false
        default: 随笔
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
        field:
          label: 标签
          name: tag
          widget: string
      - label: 草稿
        name: draft
        widget: boolean
        required: false
        default: false
        hint: 勾上后博客前台不显示这篇
      - label: 正文
        name: body
        widget: markdown