<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>博客管理后台 · giabom.online</title>
  <link rel="icon" href="/favicon/favicon-light-32.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1115;
      color: #e6e8eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      background: #16191f;
      border: 1px solid #262b33;
      border-radius: 16px;
      padding: 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 20px; font-weight: 500; margin: 0 0 12px; }
    p { font-size: 14px; color: #9aa3af; line-height: 1.7; margin: 0 0 24px; }
    .warn {
      background: rgba(227, 75, 74, 0.1);
      border: 1px solid rgba(227, 75, 74, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #f09595;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: #378add;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn:hover { background: #185fa5; }
    .back {
      display: inline-block;
      margin-top: 20px;
      font-size: 13px;
      color: #5b8bff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>博客管理后台</h1>
    <p>登录后可以发布、修改文章，改完自动部署到 giabom.online。</p>

    <div class="warn">
      ⚠️ 首次使用需要配置 GitHub 仓库，见项目里的《后台管理配置.md》
    </div>

    <a class="btn" href="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js">登录管理后台</a>

    <br><a class="back" href="/">← 返回博客首页</a>
  </div>

  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
</body>
</html>
